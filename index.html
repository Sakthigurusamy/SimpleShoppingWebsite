<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store - Shop Fresh & Save</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">🛒 Grocery Store</h1>
            <button class="cart-toggle" id="cartToggle">
                Cart (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <h2 class="section-title">Our Products</h2>
            
            <!-- Product Grid -->
            <div class="products-grid" id="productsGrid">
                <!-- Products will be dynamically inserted here -->
            </div>
        </div>
    </main>

    <!-- Shopping Cart Sidebar -->
    <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button class="close-cart" id="closeCart">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="empty-cart">Your cart is empty</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <strong>Total: $<span id="cartTotal">0.00</span></strong>
            </div>
            <button class="checkout-btn" id="checkoutBtn" disabled>Generate Invoice</button>
        </div>
    </aside>

    <!-- Cart Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Invoice Modal -->
    <div class="invoice-modal" id="invoiceModal">
        <div class="invoice-content">
            <div class="invoice-header">
                <h2>Invoice</h2>
                <button class="close-invoice" id="closeInvoice">&times;</button>
            </div>
            <div class="invoice-body" id="invoiceBody">
                <!-- Invoice content will be generated here -->
            </div>
            <div class="invoice-actions">
                <button class="btn-print" id="printInvoice">Print Invoice</button>
                <button class="btn-pdf" id="downloadPDF">Download PDF</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
